<!DOCTYPE html>

<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#254e4e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rahmat Chef">
<title>Rahmat Chef</title>
<style>
*,::before,::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --primary-dark:#254e4e;
  --accent-light:#a8d5ba;
  --bg:#F2F2F7;
  --card:#fff;
  --green:#34C759;--red:#FF3B30;
  --gray:#8E8E93;--gray2:#C7C7CC;--gray3:#E5E5EA;
  --sep:rgba(60,60,67,.12);
  --sh:0 4px 12px rgba(0,0,0,.08);
  --r:16px;--r2:12px;
  --f:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;
  --txt:#000;--txt2:#3C3C43;
  --cbar-bg:rgba(242,242,247,.97);
  --qctrl-bg:#E5E5EA;
}
body.dark{
  --bg:#0f0f0f;--card:#1c1c1e;
  --gray3:#2c2c2e;--gray2:#48484a;
  --sep:rgba(255,255,255,.1);
  --sh:0 4px 16px rgba(0,0,0,.5);
  --txt:#fff;--txt2:#ebebf5;
  --cbar-bg:rgba(20,20,22,.97);
  --qctrl-bg:#2c2c2e;
}
html,body{height:100%;background:var(--bg);font-family:var(--f);color:var(--txt);overscroll-behavior:none;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
body{max-width:430px;margin:0 auto;position:relative;overflow:hidden;height:100dvh}

.scr{position:absolute;inset:0;display:flex;flex-direction:column;background:var(–bg);
transition:transform .28s cubic-bezier(.4,0,.2,1),opacity .28s;overflow:hidden;will-change:transform;z-index:1}
.scr.off{transform:translateX(100%);pointer-events:none;z-index:2}
.scr.back{transform:translateX(-26%);pointer-events:none;opacity:.6;z-index:1}
#s-order{z-index:2}

/* NAV */
.nav{background:var(–primary-dark);border-bottom:1px solid rgba(255,255,255,.1);
padding:0 12px;display:flex;align-items:center;height:54px;flex-shrink:0;z-index:10}
.nav-c{flex:1;text-align:center}
.nav-t{font-size:17px;font-weight:700;letter-spacing:-.3px;color:#fff}
.nav-s{font-size:12px;color:var(–accent-light);margin-top:1px}
.nbtn{background:none;border:none;font-family:var(–f);font-size:17px;color:var(–accent-light);
padding:8px 4px;cursor:pointer;min-width:48px;font-weight:400;white-space:nowrap}
.nbtn.r{font-weight:600;text-align:right}
.dmbtn{background:none;border:none;font-size:20px;cursor:pointer;padding:6px;line-height:1;border-radius:8px}

/* SCROLL */
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:10px 14px 40px}
.scroll::-webkit-scrollbar{display:none}

/* TABLE */
.shdr{font-size:12px;font-weight:700;color:var(–gray);text-transform:uppercase;letter-spacing:.5px;margin:16px 0 8px 2px}
.shdr:first-child{margin-top:4px}
.tgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:4px}
.tc{min-height:unset!important;height:auto!important}
.tc{background:var(–card);border-radius:var(–r);padding:11px 12px;box-shadow:var(–sh);cursor:pointer;
display:flex;flex-direction:column;gap:2px;position:relative;overflow:hidden;
transition:transform .12s,background .2s;user-select:none;border:2px solid transparent}
.tc:active{transform:scale(.955)}
.tc.on{border-color:var(–accent-light);background:rgba(168,213,186,.07)}
.tnum{font-size:26px;font-weight:800;letter-spacing:-1px;line-height:1;color:var(–primary-dark)}
.tzone{font-size:10px;color:var(–gray);font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.tstat{display:flex;align-items:center;gap:5px;margin-top:3px}
.dot{width:7px;height:7px;border-radius:50%}
.de{background:var(–gray2)}.da{background:var(–primary-dark)}
.sl{font-size:12px;font-weight:600}
.sle{color:var(–gray)}.sla{color:var(–primary-dark)}
.tsum{font-size:12px;color:var(–primary-dark);margin-top:1px;font-weight:700}
.tbdg{position:absolute;top:9px;right:9px;background:var(–primary-dark);color:var(–accent-light);
font-size:11px;font-weight:800;border-radius:10px;padding:2px 7px;line-height:1.5;border:1px solid var(–accent-light)}

/* ── SECTION BAR (Ichimliklar / Shirinliklar) ── */
.sbar{background:var(–primary-dark);display:flex;flex-shrink:0;padding:8px 12px;gap:8px;border-bottom:1px solid rgba(255,255,255,.08)}
.sbtn{flex:1;background:rgba(255,255,255,.1);border:none;font-family:var(–f);font-size:14px;font-weight:700;
color:rgba(255,255,255,.7);padding:9px 8px;border-radius:12px;cursor:pointer;
transition:background .15s,color .15s;white-space:nowrap}
.sbtn.on{background:var(–accent-light);color:var(–primary-dark)}

/* ── CAT BAR ── */
.cbar{background:var(–cbar-bg);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
border-bottom:1px solid var(–sep);display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;
flex-shrink:0;padding:7px 10px;gap:6px}
.cbar::-webkit-scrollbar{display:none}
.cbtn{flex-shrink:0;background:var(–gray3);border:none;font-family:var(–f);font-size:13px;font-weight:600;
color:var(–txt2);padding:7px 13px;border-radius:20px;cursor:pointer;
transition:background .12s,color .12s;white-space:nowrap}
.cbtn.on{background:var(–primary-dark);color:var(–accent-light)}

/* MENU ITEMS */
.mi{background:var(–card);border-radius:var(–r2);padding:13px;box-shadow:var(–sh);
display:flex;align-items:center;gap:10px;margin-bottom:7px;user-select:none;transition:background .2s}
.inum{font-size:13px;font-weight:700;color:var(–gray2);min-width:20px;text-align:center}
.iinfo{flex:1}
.iname{font-size:15px;font-weight:500;line-height:1.25;color:var(–txt)}
.iprice{font-size:13px;color:var(–gray);margin-top:2px}
.abtn{background:var(–primary-dark);color:var(–accent-light);border:none;font-size:23px;font-weight:300;
width:34px;height:34px;border-radius:50%;cursor:pointer;display:flex;align-items:center;
justify-content:center;flex-shrink:0;transition:transform .1s,background .1s;font-family:var(–f);line-height:1}
.abtn:active{transform:scale(.82)}
.abtn.ic{background:var(–accent-light);color:var(–primary-dark)}

/* ORDER */
.ocard{background:var(–card);border-radius:var(–r);box-shadow:var(–sh);margin-bottom:8px;overflow:hidden;transition:background .2s}
.ohdr{padding:13px 15px 10px;border-bottom:1px solid var(–sep);display:flex;align-items:center;justify-content:space-between}
.ohtit{font-size:16px;font-weight:700;color:var(–primary-dark)}
.obdg{background:var(–primary-dark);color:var(–accent-light);font-size:12px;font-weight:800;border-radius:10px;padding:3px 9px}
.oclbl{font-size:13px;font-weight:800;color:var(–accent-light);text-transform:uppercase;letter-spacing:.6px;
padding:8px 15px;background:var(–primary-dark)}
.orrow{display:flex;align-items:center;gap:8px;padding:11px 15px;border-bottom:1px solid var(–sep)}
.orrow:last-child{border-bottom:none}
.oname{font-size:14px;font-weight:500;flex:1;line-height:1.3;color:var(–txt)}
.qctrl{display:flex;align-items:center;background:var(–qctrl-bg);border-radius:20px;overflow:hidden}
.qbtn{background:none;border:none;font-family:var(–f);font-size:20px;color:var(–primary-dark);
width:34px;height:32px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.qbtn:active{background:var(–gray2)}
.qnum{font-size:14px;font-weight:700;min-width:22px;text-align:center;color:var(–txt)}
.oprice{font-size:13px;color:var(–primary-dark);min-width:60px;text-align:right;font-weight:700}

/* BILL */
.bcard{background:var(–card);border-radius:var(–r);box-shadow:var(–sh);margin-bottom:8px;overflow:hidden;transition:background .2s}
.brow{display:flex;justify-content:space-between;align-items:center;padding:13px 15px;border-bottom:1px solid var(–sep)}
.brow:last-child{border-bottom:none}
.blbl{font-size:15px;color:var(–txt2)}
.bval{font-size:15px;font-weight:600;color:var(–txt)}
.brow.tot{background:rgba(37,78,78,.08)}
.brow.tot .blbl{font-size:17px;font-weight:800;color:var(–primary-dark)}
.brow.tot .bval{font-size:17px;font-weight:800;color:var(–primary-dark)}

/* NOTES */
.ncard{background:var(–card);border-radius:var(–r);box-shadow:var(–sh);margin-bottom:8px;overflow:hidden;transition:background .2s}
textarea{width:100%;border:none;font-family:var(–f);font-size:15px;color:var(–txt);
padding:14px 15px;resize:none;outline:none;background:transparent;min-height:72px;line-height:1.5}
textarea::placeholder{color:var(–gray)}

/* ACTION */
.arow{display:flex;gap:10px;margin-bottom:8px}
.xbtn{flex:1;border:none;font-family:var(–f);font-size:16px;font-weight:700;
padding:16px 8px;border-radius:var(–r2);cursor:pointer;transition:opacity .12s,transform .1s;letter-spacing:-.2px}
.xbtn:active{opacity:.75;transform:scale(.97)}
.xbtn.clr{background:rgba(255,59,48,.12);color:var(–red)}
.xbtn.pay{background:var(–primary-dark);color:var(–accent-light)}

/* EMPTY */
.empty{text-align:center;padding:40px 16px 20px;color:var(–gray)}
.ei{font-size:48px;margin-bottom:10px}
.et{font-size:15px}

/* TOAST */
.toast{position:fixed;bottom:calc(30px + env(safe-area-inset-bottom));left:50%;
transform:translateX(-50%) translateY(14px);background:rgba(37,78,78,.95);
color:var(–accent-light);font-size:14px;font-weight:600;padding:10px 22px;border-radius:22px;
pointer-events:none;opacity:0;transition:opacity .18s,transform .18s;
z-index:9999;white-space:nowrap;max-width:92vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>

</head>
<body>

<div class="scr" id="s-tables">
  <div class="nav">
    <div class="nav-c">
      <div class="nav-t">👨‍🍳 Rahmat Chef ®</div>
      <div class="nav-s">Ofitsiant paneli</div>
    </div>
    <button class="dmbtn" id="B_DM">🌙</button>
  </div>
  <div class="scroll">
    <div class="shdr">🏠 Zal — 1 dan 9 gacha</div>
    <div class="tgrid" id="g-zal"></div>
    <div class="shdr">🌿 Ko'cha — 1 dan 5 gacha</div>
    <div class="tgrid" id="g-kocha"></div>
  </div>
</div>

<div class="scr off" id="s-order">
  <div class="nav">
    <button class="nbtn" id="B_BACK">‹ Orqaga</button>
    <div class="nav-c">
      <div class="nav-t" id="o-title">Stol 1</div>
      <div class="nav-s" id="o-sub">Zal</div>
    </div>
    <button class="nbtn r" id="B_BILL">Hisob ↓</button>
  </div>

  <!-- Bo'lim tanlash -->

  <div class="sbar">
    <button class="sbtn on" id="SB_ICH" onclick="setSection('ich')">🥤 Ichimliklar</button>
    <button class="sbtn" id="SB_SHI" onclick="setSection('shi')">🍰 Shirinliklar</button>
  </div>

  <!-- Kategoriya -->

  <div class="cbar" id="cbar"></div>

  <div class="scroll" id="o-scroll">
    <div id="menu-list"></div>
    <div class="empty" id="el-empty">
      <div class="ei">🛒</div>
      <div class="et">Hozircha buyurtma yo'q</div>
    </div>
    <div id="el-order"></div>
    <div id="el-bill"></div>
    <div class="ncard" id="el-notes">
      <textarea id="notes-inp" placeholder="📝 Izoh (shakar yo'q, muz yo'q...)" rows="3"></textarea>
    </div>
    <div class="arow">
      <button class="xbtn clr" id="B_CLEAR">🗑 Tozalash</button>
      <button class="xbtn pay" id="B_PAY">✓ To'landi</button>
    </div>
    <div style="height:20px"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

const SECTIONS={

  shi:{

    cats:{

      ],

      ],
      "Makaron":[

        {n:"Milfy (napoleon uslubida)",p:35000}
      ]

};

// Flat MENU for catOf lookup
const MENU={};
for(const sec of Object.values(SECTIONS))
  for(const[cat,items] of Object.entries(sec.cats))
    MENU[cat]=items;
const ALL_CATS=Object.keys(MENU);

const SVC=0.15;
const KEY='rc_v4';

let orders={}, curTable=null, curSection='ich', curCat='Choy';
let darkMode=localStorage.getItem('rc_dark')==='1';

function applyDark(){
  document.body.classList.toggle('dark',darkMode);
  document.getElementById('B_DM').textContent=darkMode?'☀️':'🌙';
}
applyDark();
document.getElementById('B_DM').onclick=function(){
  darkMode=!darkMode;
  localStorage.setItem('rc_dark',darkMode?'1':'0');
  applyDark();
};

function save(){try{localStorage.setItem(KEY,JSON.stringify(orders))}catch(e){}}
function load(){try{const d=localStorage.getItem(KEY);if(d)orders=JSON.parse(d)}catch(e){}}
load();

function fmt(n){return n.toLocaleString('uz-UZ')+" so'm"}
function ord(t){if(!orders[t])orders[t]={items:[],notes:""};return orders[t]}
function sumQty(t){return ord(t).items.reduce((s,i)=>s+i.qty,0)}
function sumMoney(t){return ord(t).items.reduce((s,i)=>s+i.price*i.qty,0)}
function catOf(name,price){
  for(const c of ALL_CATS)
    for(const m of MENU[c])
      if(m.n===name&&m.p===price)return c;
  return"Boshqa";
}

let tT;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('on');
  clearTimeout(tT);tT=setTimeout(()=>el.classList.remove('on'),2000);
}

function setSection(sec){
  curSection=sec;
  const cats=Object.keys(SECTIONS[sec].cats);
  curCat=cats[0];
  document.getElementById('SB_ICH').classList.toggle('on',sec==='ich');
  document.getElementById('SB_SHI').classList.toggle('on',sec==='shi');
  buildCatBar();buildMenu();
  document.getElementById('o-scroll').scrollTo({top:0,behavior:'smooth'});
}

function buildTables(){
  document.getElementById('g-zal').innerHTML='';
  document.getElementById('g-kocha').innerHTML='';
  for(let i=1;i<=9;i++){
    const id='Z'+i,q=sumQty(id),m=sumMoney(id),on=q>0;
    const d=document.createElement('div');
    d.className='tc'+(on?' on':'');
    d.innerHTML=`<div class="tnum">${i}</div>
      <div class="tzone">Zal</div>
      <div class="tstat"><div class="dot ${on?'da':'de'}"></div><div class="sl ${on?'sla':'sle'}">${on?"Faol":"Bo'sh"}</div></div>
      <div class="tsum">${on?fmt(m):''}</div>
      ${q>0?`<div class="tbdg">${q}</div>`:''}`;
    d.onclick=()=>openTable(id,'Zal',i);
    document.getElementById('g-zal').appendChild(d);
  }
  for(let i=1;i<=5;i++){
    const id='K'+i,q=sumQty(id),m=sumMoney(id),on=q>0;
    const d=document.createElement('div');
    d.className='tc'+(on?' on':'');
    d.innerHTML=`<div class="tnum">${i}</div>
      <div class="tzone">Ko'cha</div>
      <div class="tstat"><div class="dot ${on?'da':'de'}"></div><div class="sl ${on?'sla':'sle'}">${on?"Faol":"Bo'sh"}</div></div>
      <div class="tsum">${on?fmt(m):''}</div>
      ${q>0?`<div class="tbdg">${q}</div>`:''}`;
    d.onclick=()=>openTable(id,"Ko'cha",i);
    document.getElementById('g-kocha').appendChild(d);
  }
}

function openTable(id,zone,num){
  curTable=id; curSection='ich'; curCat='Choy';
  document.getElementById('o-title').textContent='Stol '+num;
  document.getElementById('o-sub').textContent=zone;
  document.getElementById('notes-inp').value=ord(id).notes||'';
  document.getElementById('SB_ICH').classList.add('on');
  document.getElementById('SB_SHI').classList.remove('on');
  buildCatBar();buildMenu();buildOrder();
  document.getElementById('s-tables').classList.add('back');
  document.getElementById('s-order').classList.remove('off');
}
function goBack(){
  document.getElementById('s-order').classList.add('off');
  document.getElementById('s-tables').classList.remove('back');
  curTable=null;buildTables();
}

function buildCatBar(){
  const bar=document.getElementById('cbar');
  bar.innerHTML='';
  const cats=Object.keys(SECTIONS[curSection].cats);
  cats.forEach(c=>{
    const b=document.createElement('button');
    b.className='cbtn'+(c===curCat?' on':'');
    b.textContent=c;
    b.onclick=()=>{curCat=c;buildCatBar();buildMenu();
      document.getElementById('o-scroll').scrollTo({top:0,behavior:'smooth'});};
    bar.appendChild(b);
  });
}

function buildMenu(){
  const items=SECTIONS[curSection].cats[curCat]||[];
  const o=ord(curTable);
  const el=document.getElementById('menu-list');
  el.innerHTML=`<div class="shdr" style="margin-top:4px">${curCat}</div>`;
  items.forEach((item,i)=>{
    const ic=o.items.some(x=>x.name===item.n&&x.price===item.p);
    const d=document.createElement('div');
    d.className='mi';
    d.innerHTML=`<span class="inum">${i+1}</span>
      <div class="iinfo"><div class="iname">${item.n}</div><div class="iprice">${fmt(item.p)}</div></div>
      <button class="abtn${ic?' ic':''}" data-n="${item.n}" data-p="${item.p}">+</button>`;
    el.appendChild(d);
  });
}

document.getElementById('menu-list').addEventListener('click',e=>{
  const b=e.target.closest('.abtn');
  if(!b||!curTable)return;
  const name=b.dataset.n,price=+b.dataset.p;
  const o=ord(curTable);
  const ex=o.items.find(x=>x.name===name&&x.price===price);
  if(ex)ex.qty++;else o.items.push({name,price,qty:1});
  save();buildMenu();buildOrder();
  toast('✓ '+name);
});

function buildOrder(){
  const o=ord(curTable);
  const elEmpty=document.getElementById('el-empty');
  const elOrder=document.getElementById('el-order');
  const elBill=document.getElementById('el-bill');
  const elNotes=document.getElementById('el-notes');
  if(!o.items.length){
    elEmpty.style.display='';
    elOrder.innerHTML='';elBill.innerHTML='';
    elNotes.style.opacity='0.3';return;
  }
  elEmpty.style.display='none';
  elNotes.style.opacity='1';
  const groups={};
  o.items.forEach((item,idx)=>{
    const c=catOf(item.name,item.price);
    if(!groups[c])groups[c]=[];
    groups[c].push({...item,_i:idx});
  });
  const totalQty=o.items.reduce((s,i)=>s+i.qty,0);
  let html=`<div class="ocard"><div class="ohdr"><span class="ohtit">Buyurtma</span><span class="obdg">${totalQty} ta</span></div>`;
  Object.entries(groups).forEach(([cat,items])=>{
    html+=`<div class="oclbl">${cat}</div>`;
    items.forEach(item=>{
      html+=`<div class="orrow">
        <div class="oname">${item.name}</div>
        <div class="qctrl">
          <button class="qbtn" data-a="d" data-i="${item._i}">−</button>
          <span class="qnum">${item.qty}</span>
          <button class="qbtn" data-a="u" data-i="${item._i}">+</button>
        </div>
        <div class="oprice">${fmt(item.price*item.qty)}</div>
      </div>`;
    });
  });
  html+='</div>';
  elOrder.innerHTML=html;
  const sub=o.items.reduce((s,i)=>s+i.price*i.qty,0);
  const svc=Math.round(sub*SVC);
  elBill.innerHTML=`<div class="bcard">
    <div class="brow"><span class="blbl">Subtotal</span><span class="bval">${fmt(sub)}</span></div>
    <div class="brow"><span class="blbl">Xizmat (15%)</span><span class="bval">${fmt(svc)}</span></div>
    <div class="brow tot"><span class="blbl">JAMI TO'LOV</span><span class="bval">${fmt(sub+svc)}</span></div>
  </div>`;
}

document.getElementById('el-order').addEventListener('click',e=>{
  const b=e.target.closest('.qbtn');
  if(!b||!curTable)return;
  const idx=+b.dataset.i,a=b.dataset.a;
  const o=ord(curTable);
  if(a==='u')o.items[idx].qty++;
  else{o.items[idx].qty--;if(o.items[idx].qty<=0)o.items.splice(idx,1);}
  save();buildMenu();buildOrder();
});

document.getElementById('notes-inp').addEventListener('input',function(){
  if(curTable){ord(curTable).notes=this.value;save();}
});

document.getElementById('B_BACK').onclick=goBack;
document.getElementById('B_BILL').onclick=function(){
  document.getElementById('o-scroll').scrollTo({top:99999,behavior:'smooth'});
};
document.getElementById('B_CLEAR').onclick=function(){
  if(!curTable){toast("Stol tanlanmagan");return;}
  if(!confirm("Buyurtma o'chirilsinmi?"))return;
  orders[curTable]={items:[],notes:""};
  save();document.getElementById('notes-inp').value='';
  buildMenu();buildOrder();
  toast('🗑 Stol tozalandi');
};
document.getElementById('B_PAY').onclick=function(){
  if(!curTable){toast("Stol tanlanmagan");return;}
  const o=ord(curTable);
  if(!o.items.length){toast("Buyurtma yo'q!");return;}
  const sub=o.items.reduce((s,i)=>s+i.price*i.qty,0);
  const svc=Math.round(sub*SVC);
  if(!confirm('Subtotal: '+fmt(sub)+'\nXizmat: '+fmt(svc)+"\nJAMI: "+fmt(sub+svc)+"\n\nTo'landi deb belgilansinmi?"))return;
  orders[curTable]={items:[],notes:""};
  save();goBack();
  toast("✅ To'landi!");
};

if('serviceWorker' in navigator){
  const sw=`const V='rc3';
self.addEventListener('install',()=>self.skipWaiting());
self.addEventListener('activate',()=>self.clients.claim());
self.addEventListener('fetch',e=>{
  if(e.request.method!=='GET')return;
  e.respondWith(caches.open(V).then(c=>
    c.match(e.request).then(r=>r||fetch(e.request).then(res=>{c.put(e.request,res.clone());return res;}))
  ));
});`;
  try{
    const blob=new Blob([sw],{type:'text/javascript'});
    navigator.serviceWorker.register(URL.createObjectURL(blob));
  }catch(e){}
}

buildTables();
</script>

</body>
</html>
