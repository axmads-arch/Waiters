<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#F2F2F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rahmat Chef">
<title>Rahmat Chef</title>
<style>
*,::before,::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#F2F2F7;--card:#fff;--acc:#007AFF;--green:#34C759;--red:#FF3B30;
  --gray:#8E8E93;--gray2:#C7C7CC;--gray3:#E5E5EA;--sep:rgba(60,60,67,.12);
  --sh:0 2px 10px rgba(0,0,0,.07);--r:16px;--r2:12px;
  --f:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;
}
html,body{height:100%;background:var(--bg);font-family:var(--f);color:#000;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
body{max-width:430px;margin:0 auto;position:relative;overflow:hidden;height:100dvh}

/* SCREENS */
.scr{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);
     transition:transform .28s cubic-bezier(.4,0,.2,1),opacity .28s;overflow:hidden;will-change:transform}
.scr.off{transform:translateX(100%);pointer-events:none}
.scr.back{transform:translateX(-26%);pointer-events:none;opacity:.5}

/* NAV */
.nav{background:rgba(242,242,247,.95);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
     border-bottom:1px solid var(--sep);padding:0 12px;display:flex;align-items:center;height:54px;flex-shrink:0;z-index:10}
.nav-c{flex:1;text-align:center}
.nav-t{font-size:17px;font-weight:700;letter-spacing:-.3px}
.nav-s{font-size:12px;color:var(--gray);margin-top:1px}
.nbtn{background:none;border:none;font-family:var(--f);font-size:17px;color:var(--acc);
      padding:8px 4px;cursor:pointer;min-width:48px;font-weight:400;white-space:nowrap}
.nbtn.r{font-weight:600;text-align:right}

/* SCROLL */
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:10px 14px 40px}
.scroll::-webkit-scrollbar{display:none}

/* TABLE GRID */
.shdr{font-size:12px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.5px;margin:16px 0 8px 2px}
.shdr:first-child{margin-top:4px}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:4px}
.tc{background:var(--card);border-radius:var(--r);padding:15px 13px;box-shadow:var(--sh);cursor:pointer;
    display:flex;flex-direction:column;gap:4px;position:relative;overflow:hidden;
    transition:transform .12s;user-select:none;border:2px solid transparent}
.tc:active{transform:scale(.955)}
.tc.on{border-color:var(--green)}
.tnum{font-size:32px;font-weight:800;letter-spacing:-1.5px;line-height:1}
.tzone{font-size:11px;color:var(--gray);font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.tstat{display:flex;align-items:center;gap:5px;margin-top:3px}
.dot{width:7px;height:7px;border-radius:50%}
.de{background:var(--gray2)}.da{background:var(--green)}
.sl{font-size:12px;font-weight:600}
.sle{color:var(--gray)}.sla{color:var(--green)}
.tsum{font-size:12px;color:var(--gray);margin-top:1px;font-weight:500}
.tbdg{position:absolute;top:9px;right:9px;background:var(--red);color:#fff;
      font-size:11px;font-weight:800;border-radius:10px;padding:2px 7px;line-height:1.5}

/* CAT BAR */
.cbar{background:rgba(242,242,247,.95);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
      border-bottom:1px solid var(--sep);display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;
      flex-shrink:0;padding:7px 10px;gap:6px}
.cbar::-webkit-scrollbar{display:none}
.cbtn{flex-shrink:0;background:var(--gray3);border:none;font-family:var(--f);font-size:13px;font-weight:600;
      color:#3C3C43;padding:7px 13px;border-radius:20px;cursor:pointer;
      transition:background .12s,color .12s;white-space:nowrap}
.cbtn.on{background:var(--acc);color:#fff}

/* MENU ITEMS */
.mi{background:var(--card);border-radius:var(--r2);padding:13px 13px;box-shadow:var(--sh);
    display:flex;align-items:center;gap:10px;margin-bottom:7px;user-select:none}
.inum{font-size:13px;font-weight:700;color:var(--gray2);min-width:20px;text-align:center}
.iinfo{flex:1}
.iname{font-size:15px;font-weight:500;line-height:1.25}
.iprice{font-size:13px;color:var(--gray);margin-top:2px}
.abtn{background:var(--acc);color:#fff;border:none;font-size:23px;font-weight:300;
      width:34px;height:34px;border-radius:50%;cursor:pointer;display:flex;align-items:center;
      justify-content:center;flex-shrink:0;transition:transform .1s,background .1s;font-family:var(--f);line-height:1}
.abtn:active{transform:scale(.82)}
.abtn.ic{background:var(--green)}

/* ORDER CARD */
.ocard{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:8px;overflow:hidden}
.ohdr{padding:13px 15px 10px;border-bottom:1px solid var(--sep);display:flex;align-items:center;justify-content:space-between}
.ohtit{font-size:16px;font-weight:700}
.obdg{background:var(--red);color:#fff;font-size:12px;font-weight:800;border-radius:10px;padding:3px 9px}

/* CATEGORY LABEL inside order — big and colored */
.oclbl{font-size:13px;font-weight:800;color:#fff;text-transform:uppercase;letter-spacing:.6px;
       padding:8px 15px;background:var(--acc)}

.orrow{display:flex;align-items:center;gap:8px;padding:11px 15px;border-bottom:1px solid var(--sep)}
.orrow:last-child{border-bottom:none}
.oname{font-size:14px;font-weight:500;flex:1;line-height:1.3}
.qctrl{display:flex;align-items:center;background:var(--gray3);border-radius:20px;overflow:hidden}
.qbtn{background:none;border:none;font-family:var(--f);font-size:20px;color:var(--acc);
      width:34px;height:32px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.qbtn:active{background:var(--gray2)}
.qnum{font-size:14px;font-weight:700;min-width:22px;text-align:center}
.oprice{font-size:13px;color:var(--gray);min-width:60px;text-align:right;font-weight:600}

/* BILL */
.bcard{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:8px;overflow:hidden}
.brow{display:flex;justify-content:space-between;align-items:center;padding:13px 15px;border-bottom:1px solid var(--sep)}
.brow:last-child{border-bottom:none}
.blbl{font-size:15px;color:#3C3C43}
.bval{font-size:15px;font-weight:600}
.brow.tot{background:rgba(0,122,255,.05)}
.brow.tot .blbl{font-size:17px;font-weight:800}
.brow.tot .bval{font-size:17px;font-weight:800;color:var(--acc)}

/* NOTES */
.ncard{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:8px;overflow:hidden}
textarea{width:100%;border:none;font-family:var(--f);font-size:15px;color:#000;
         padding:14px 15px;resize:none;outline:none;background:transparent;min-height:72px;line-height:1.5}
textarea::placeholder{color:var(--gray)}

/* ACTION BUTTONS */
.arow{display:flex;gap:10px;margin-bottom:8px}
.xbtn{flex:1;border:none;font-family:var(--f);font-size:16px;font-weight:700;
      padding:16px 8px;border-radius:var(--r2);cursor:pointer;
      transition:opacity .12s,transform .1s;letter-spacing:-.2px}
.xbtn:active{opacity:.75;transform:scale(.97)}
.xbtn.clr{background:rgba(255,59,48,.1);color:var(--red)}
.xbtn.pay{background:var(--green);color:#fff}

/* EMPTY */
.empty{text-align:center;padding:40px 16px 20px;color:var(--gray)}
.ei{font-size:48px;margin-bottom:10px}
.et{font-size:15px}

/* TOAST */
.toast{position:fixed;bottom:calc(30px + env(safe-area-inset-bottom));left:50%;
       transform:translateX(-50%) translateY(14px);background:rgba(0,0,0,.85);
       color:#fff;font-size:14px;font-weight:600;padding:10px 22px;border-radius:22px;
       pointer-events:none;opacity:0;transition:opacity .18s,transform .18s;
       z-index:9999;white-space:nowrap;max-width:92vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<!-- SCREEN 1: TABLES -->
<div class="scr" id="s-tables">
  <div class="nav">
    <div class="nav-c">
      <div class="nav-t">👨‍🍳 Rahmat Chef</div>
      <div class="nav-s">Ofitsiant paneli</div>
    </div>
  </div>
  <div class="scroll">
    <div class="shdr">🏠 Zal — 1 dan 9 gacha</div>
    <div class="tgrid" id="g-zal"></div>
    <div class="shdr">🌿 Ko'cha — 10 dan 14 gacha</div>
    <div class="tgrid" id="g-kocha"></div>
  </div>
</div>

<!-- SCREEN 2: ORDER -->
<div class="scr off" id="s-order">
  <div class="nav">
    <button class="nbtn" id="B_BACK">‹ Orqaga</button>
    <div class="nav-c">
      <div class="nav-t" id="o-title">Stol 1</div>
      <div class="nav-s" id="o-sub">Zal</div>
    </div>
    <button class="nbtn r" id="B_BILL">Hisob ↓</button>
  </div>
  <div class="cbar" id="cbar"></div>
  <div class="scroll" id="o-scroll">
    <div id="menu-list"></div>

    <!-- empty state -->
    <div class="empty" id="el-empty">
      <div class="ei">🛒</div>
      <div class="et">Hozircha buyurtma yo'q</div>
    </div>

    <!-- order rows (always in DOM) -->
    <div id="el-order"></div>

    <!-- bill (always in DOM) -->
    <div id="el-bill"></div>

    <!-- notes (always in DOM) -->
    <div class="ncard" id="el-notes">
      <textarea id="notes-inp" placeholder="📝 Izoh (shakar yo'q, muz yo'q...)" rows="3"></textarea>
    </div>

    <!-- action buttons (always in DOM, never removed) -->
    <div class="arow">
      <button class="xbtn clr" id="B_CLEAR">🗑 Tozalash</button>
      <button class="xbtn pay" id="B_PAY">✓ To'landi</button>
    </div>

    <div style="height:20px"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ── MENU ── */
const MENU={
  "Bar (Choy)":[{n:"Kok choy",p:15000},{n:"Qora choy",p:15000},{n:"Fruktoviy choy",p:25000},
    {n:"Yagodniy choy",p:25000},{n:"Imbir choy",p:25000},{n:"Bardak",p:5000},
    {n:"Bardak choy",p:25000},{n:"Limonli choy",p:20000}],
  "Coffee":[{n:"Cappucino mini",p:30000},{n:"Cappucino katta",p:35000},
    {n:"Americano mini",p:25000},{n:"Americano katta",p:30000},
    {n:"Espresso",p:25000},{n:"Latte",p:30000},{n:"Flat white",p:30000},{n:"Raff",p:35000}],
  "Salqin ichimliklar":[{n:"Ice tea",p:35000},{n:"Ice tea grafin",p:50000},{n:"Ice coffee",p:35000},
    {n:"Moxito",p:35000},{n:"Moxito grafin",p:50000},{n:"Cola",p:10000},{n:"Fanta",p:10000},
    {n:"Pepsi",p:10000},{n:"Chortoq",p:10000},{n:"Hydrolife",p:5000},{n:"Royal",p:10000}],
  "San Sebastian":[{n:"Nutella",p:5000},{n:"Classic",p:20000},{n:"Fistashka",p:20000},
    {n:"Malina",p:20000},{n:"Matilda",p:20000},{n:"Dragon",p:20000},{n:"Caramel",p:20000},
    {n:"Apelsin",p:20000},{n:"Coffee",p:20000},{n:"Matcha",p:20000},{n:"Dieticheski",p:20000}],
  "Kurasan":[{n:"Shokoladli",p:20000},{n:"Fistashkali",p:20000},
    {n:"Mindalli (bodom)",p:20000},{n:"Kurasan pustoy",p:17000}],
  "Cheesecake":[{n:"Lotus",p:35000},{n:"Malina",p:35000},{n:"Shokolad",p:35000},{n:"Oreo",p:35000}],
  "Medovik":[{n:"Classic",p:35000},{n:"Caramel",p:35000}],
  "Napoleon":[{n:"Classik",p:35000},{n:"Shokolad",p:35000},{n:"Avganski",p:35000}],
  "Muz":[{n:"Yashil",p:20000},{n:"Sariq",p:20000},{n:"Nok",p:20000},{n:"Qora",p:20000},
    {n:"Malina",p:20000},{n:"Trubichka",p:10000},{n:"Biskuit",p:18000}],
  "Pirog":[{n:"Olmali",p:17000},{n:"Olchali",p:17000},{n:"Tvorogli",p:17000}],
  "Biscuit":[{n:"Biscuit",p:35000}]
};
const CATS=Object.keys(MENU);
const SVC=0.15;
const KEY='rc_v3';

/* ── STATE ── */
let orders={}, curTable=null, curCat=CATS[0];

function save(){try{localStorage.setItem(KEY,JSON.stringify(orders))}catch(e){}}
function load(){try{const d=localStorage.getItem(KEY);if(d)orders=JSON.parse(d)}catch(e){}}
load();

function fmt(n){return n.toLocaleString('uz-UZ')+" so'm"}
function ord(t){if(!orders[t])orders[t]={items:[],notes:""};return orders[t]}
function sumQty(t){return ord(t).items.reduce((s,i)=>s+i.qty,0)}
function sumMoney(t){return ord(t).items.reduce((s,i)=>s+i.price*i.qty,0)}
function catOf(name,price){
  for(const c of CATS)for(const m of MENU[c])if(m.n===name&&m.p===price)return c;
  return"Boshqa";
}

let tT;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('on');
  clearTimeout(tT);tT=setTimeout(()=>el.classList.remove('on'),2000);
}

/* ── TABLES ── */
function buildTables(){
  ['g-zal','g-kocha'].forEach(id=>document.getElementById(id).innerHTML='');
  for(let i=1;i<=14;i++){
    const q=sumQty(i),m=sumMoney(i),on=q>0;
    const d=document.createElement('div');
    d.className='tc'+(on?' on':'');
    d.innerHTML=`<div class="tnum">${i}</div>
      <div class="tzone">${i<=9?"Zal":"Ko'cha"}</div>
      <div class="tstat"><div class="dot ${on?'da':'de'}"></div><div class="sl ${on?'sla':'sle'}">${on?"Faol":"Bo'sh"}</div></div>
      <div class="tsum">${on?fmt(m):''}</div>
      ${q>0?`<div class="tbdg">${q}</div>`:''}`;
    d.onclick=()=>openTable(i);
    document.getElementById(i<=9?'g-zal':'g-kocha').appendChild(d);
  }
}

/* ── OPEN / CLOSE TABLE ── */
function openTable(id){
  curTable=id;curCat=CATS[0];
  document.getElementById('o-title').textContent='Stol '+id;
  document.getElementById('o-sub').textContent=id<=9?"Zal":"Ko'cha";
  document.getElementById('notes-inp').value=ord(id).notes||'';
  buildCatBar();buildMenu();buildOrder();
  document.getElementById('s-tables').classList.add('back');
  document.getElementById('s-order').classList.remove('off');
}
function goBack(){
  document.getElementById('s-order').classList.add('off');
  document.getElementById('s-tables').classList.remove('back');
  curTable=null;buildTables();
}

/* ── CAT BAR ── */
function buildCatBar(){
  const bar=document.getElementById('cbar');
  bar.innerHTML='';
  CATS.forEach(c=>{
    const b=document.createElement('button');
    b.className='cbtn'+(c===curCat?' on':'');
    b.textContent=c;
    b.onclick=()=>{curCat=c;buildCatBar();buildMenu();
      document.getElementById('o-scroll').scrollTo({top:0,behavior:'smooth'});};
    bar.appendChild(b);
  });
}

/* ── MENU ── */
function buildMenu(){
  const items=MENU[curCat];
  const o=ord(curTable);
  const el=document.getElementById('menu-list');
  el.innerHTML=`<div class="shdr" style="margin-top:4px">${curCat}</div>`;
  items.forEach((item,i)=>{
    const ic=o.items.some(x=>x.name===item.n&&x.price===item.p);
    const d=document.createElement('div');
    d.className='mi';
    d.innerHTML=`<span class="inum">${i+1}</span>
      <div class="iinfo"><div class="iname">${item.n}</div><div class="iprice">${fmt(item.p)}</div></div>
      <button class="abtn${ic?' ic':''}" data-n="${item.n}" data-p="${item.p}">+</button>`;
    el.appendChild(d);
  });
}

document.getElementById('menu-list').addEventListener('click',e=>{
  const b=e.target.closest('.abtn');
  if(!b||!curTable)return;
  const name=b.dataset.n,price=+b.dataset.p;
  const o=ord(curTable);
  const ex=o.items.find(x=>x.name===name&&x.price===price);
  if(ex)ex.qty++;else o.items.push({name,price,qty:1});
  save();buildMenu();buildOrder();
  toast('✓ '+name);
});

/* ── ORDER ── */
function buildOrder(){
  const o=ord(curTable);
  const elEmpty=document.getElementById('el-empty');
  const elOrder=document.getElementById('el-order');
  const elBill=document.getElementById('el-bill');
  const elNotes=document.getElementById('el-notes');

  if(!o.items.length){
    elEmpty.style.display='';
    elOrder.innerHTML='';
    elBill.innerHTML='';
    elNotes.style.opacity='0.3';
    return;
  }

  elEmpty.style.display='none';
  elNotes.style.opacity='1';

  /* group by cat */
  const groups={};
  o.items.forEach((item,idx)=>{
    const c=catOf(item.name,item.price);
    if(!groups[c])groups[c]=[];
    groups[c].push({...item,_i:idx});
  });

  const totalQty=o.items.reduce((s,i)=>s+i.qty,0);
  let html=`<div class="ocard"><div class="ohdr"><span class="ohtit">Buyurtma</span><span class="obdg">${totalQty} ta</span></div>`;
  Object.entries(groups).forEach(([cat,items])=>{
    html+=`<div class="oclbl">${cat}</div>`;
    items.forEach(item=>{
      html+=`<div class="orrow">
        <div class="oname">${item.name}</div>
        <div class="qctrl">
          <button class="qbtn" data-a="d" data-i="${item._i}">−</button>
          <span class="qnum">${item.qty}</span>
          <button class="qbtn" data-a="u" data-i="${item._i}">+</button>
        </div>
        <div class="oprice">${fmt(item.price*item.qty)}</div>
      </div>`;
    });
  });
  html+='</div>';
  elOrder.innerHTML=html;

  const sub=o.items.reduce((s,i)=>s+i.price*i.qty,0);
  const svc=Math.round(sub*SVC);
  elBill.innerHTML=`<div class="bcard">
    <div class="brow"><span class="blbl">Subtotal</span><span class="bval">${fmt(sub)}</span></div>
    <div class="brow"><span class="blbl">Xizmat (15%)</span><span class="bval">${fmt(svc)}</span></div>
    <div class="brow tot"><span class="blbl">JAMI TO'LOV</span><span class="bval">${fmt(sub+svc)}</span></div>
  </div>`;
}

document.getElementById('el-order').addEventListener('click',e=>{
  const b=e.target.closest('.qbtn');
  if(!b||!curTable)return;
  const idx=+b.dataset.i,a=b.dataset.a;
  const o=ord(curTable);
  if(a==='u')o.items[idx].qty++;
  else{o.items[idx].qty--;if(o.items[idx].qty<=0)o.items.splice(idx,1);}
  save();buildMenu();buildOrder();
});

/* ── NOTES ── */
document.getElementById('notes-inp').addEventListener('input',function(){
  if(curTable){ord(curTable).notes=this.value;save();}
});

/* ── NAV BUTTONS ── */
document.getElementById('B_BACK').onclick=goBack;

document.getElementById('B_BILL').onclick=function(){
  document.getElementById('o-scroll').scrollTo({top:99999,behavior:'smooth'});
};

document.getElementById('B_CLEAR').onclick=function(){
  if(!curTable){toast("Stol tanlanmagan");return;}
  if(!confirm('Stol '+curTable+" buyurtmasi o'chirilsinmi?"))return;
  orders[curTable]={items:[],notes:""};
  save();
  document.getElementById('notes-inp').value='';
  buildMenu();buildOrder();
  toast('🗑 Stol '+curTable+' tozalandi');
};

document.getElementById('B_PAY').onclick=function(){
  if(!curTable){toast("Stol tanlanmagan");return;}
  const o=ord(curTable);
  if(!o.items.length){toast("Buyurtma yo'q!");return;}
  const sub=o.items.reduce((s,i)=>s+i.price*i.qty,0);
  const svc=Math.round(sub*SVC);
  if(!confirm('Stol '+curTable+'\nSubtotal: '+fmt(sub)+'\nXizmat: '+fmt(svc)+"\nJAMI TO'LOV: "+fmt(sub+svc)+"\n\nTo'landi deb belgilansinmi?"))return;
  orders[curTable]={items:[],notes:""};
  save();goBack();
  toast('✅ Stol '+curTable+" to'landi!");
};

/* ── SERVICE WORKER (offline cache) ── */
if('serviceWorker' in navigator){
  const sw=`const V='rc1';
self.addEventListener('install',()=>self.skipWaiting());
self.addEventListener('activate',()=>self.clients.claim());
self.addEventListener('fetch',e=>{
  if(e.request.method!=='GET')return;
  e.respondWith(caches.open(V).then(c=>
    c.match(e.request).then(r=>r||fetch(e.request).then(res=>{c.put(e.request,res.clone());return res;}))
  ));
});`;
  try{
    const blob=new Blob([sw],{type:'text/javascript'});
    navigator.serviceWorker.register(URL.createObjectURL(blob));
  }catch(e){}
}

/* ── INIT ── */
buildTables();
</script>
</body>
</html>
